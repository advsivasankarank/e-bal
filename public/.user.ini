; Raised from PHP's default of 1000 -- the Fixed Asset Register's "Save
; Classification" form posts ~7 input fields per register row (asset_id,
; asset_category, useful_life_years, residual_value_pct, depreciation_method,
; addition_date, disposal_date), and a single Schedule III Note 11 Excel
; import can now produce 800+ individual-asset rows. Below this limit, PHP
; silently truncates $_POST past the cap instead of erroring, which would
; corrupt classification data for every row beyond roughly the first 140
; without any visible failure. Only takes effect under PHP-FPM/CGI SAPIs
; (per-directory .user.ini is not read under mod_php); harmless no-op
; otherwise.
max_input_vars = 10000
